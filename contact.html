<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fairview Education Consultancy</title>
    <!-- Updated Favicon to logo.jfif -->
    <link rel="icon" type="image/jpeg" href="images/logo.jfif">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">

    <!-- This div will be replaced by the header from components/layout.js -->
    <div id="header-placeholder"></div>

    <main>
        <section class="hero" style="height: 40vh;">
            <img src="images/hero_contact.jpg" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1516387938699-a93567ec168e?auto=format&fit=crop&q=80&w=1200';" alt="Contact Us" class="hero-bg" style="opacity: 0.3;">
            <div class="hero-content animate-on-scroll" style="text-align: center; margin: 0 auto;">
                <h1 style="font-size: 3.5rem;">Get In <span style="color: var(--secondary);">Touch</span></h1>
            </div>
        </section>

        <section class="container" style="padding-top: 3rem;">
            <div class="contact-grid animate-on-scroll">
                
                <!-- Contact Information -->
                <div>
                    <h3 style="font-size: 1.8rem; color: var(--primary); margin-bottom: 1rem;">Contact Details</h3>
                    <p style="color: var(--text-muted); margin-bottom: 2.5rem;">We are here to answer any questions you have about studying abroad. Reach out to us directly or visit our office!</p>
                    
                    <div class="info-item">
                        <div class="icon-wrapper"><i class="fas fa-map-marker-alt"></i></div>
                        <div>
                            <p>Head Office</p>
                            <span>Balaju-16, Kathmandu, Nepal</span>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <div class="icon-wrapper"><i class="fas fa-phone-alt"></i></div>
                        <div>
                            <p>Call Us</p>
                            <span>+977 01-4950227</span>
                            <span>Mobile: 984179256</span>
                        </div>
                    </div>
                    
                    <div class="info-item">
                        <div class="icon-wrapper"><i class="fas fa-envelope"></i></div>
                        <div>
                            <p>Email Us</p>
                            <span style="word-break: break-all;">fairview.edu2079@gmail.com</span>
                        </div>
                    </div>
                </div>

                <!-- Contact Form -->
                <div style="background: var(--light); padding: 2.5rem; border-radius: var(--radius);">
                    <h3 style="color: var(--primary); margin-bottom: 1.5rem; font-size: 1.8rem;">Send a Message</h3>
                    <form class="contact-form" action="#" method="POST">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <input type="text" placeholder="Your Full Name" required>
                            <input type="tel" placeholder="Your Phone Number" required>
                        </div>
                        <input type="email" placeholder="Your Email Address" required>
                        <select class="contact-form" style="width: 100%; padding: 16px 20px; border: 2px solid transparent; border-radius: 12px; font-size: 1rem; font-family: 'Poppins'; background: var(--white); color: var(--text-muted); outline: none;">
                            <option value="">Interested Study Destination...</option>
                            <option value="Australia">Australia</option>
                            <option value="USA">USA</option>
                            <option value="UK">UK</option>
                            <option value="Canada">Canada</option>
                            <option value="Japan">Japan</option>
                            <option value="South Korea">South Korea</option>
                        </select>
                        <textarea placeholder="Tell us about your academic background and plans..." required></textarea>
                        <button type="submit" class="btn" style="width: 100%;">Submit Inquiry <i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
                
            </div>
        </section>
    </main>

    <!-- This div will be replaced by the footer from components/layout.js -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="components/layout.js"></script>
    <script src="script.js"></script>
</body>
</html>
